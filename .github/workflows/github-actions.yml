name: assignment-test

on:
  push:
    tags-ignore:
      - '*'
    branches:
      - '*'

jobs:
  full-test:
    runs-on: self-hosted
    steps:
      # STEP 1: Set up SSH agent first so credentials are ready
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # STEP 2: Checkout with SSH auth configured
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false
          submodules: 'recursive'
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # STEP 3: Run the build (Single-line formatting prevents whitespace parser bugs)
      - name: Run build
        timeout-minutes: 600
        run: docker run --rm -v $SSH_AUTH_SOCK:/ssh-agent -e SSH_AUTH_SOCK=/ssh-agent -e GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no" -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} cuaesd/aesd-autotest:24-assignment6-yocto --workdir=${GITHUB_WORKSPACE} ./build.sh

      # STEP 4: Clean up SSH keys
      - name: Cleanup
        if: always()
        run: ssh-add -D

      # STEP 5: Run tests (Single-line formatting prevents whitespace parser bugs)
      - name: Run full test
        timeout-minutes: 15
        run: docker run --rm -v ${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE} cuaesd/aesd-autotest:assignment6-yocto --workdir=${GITHUB_WORKSPACE} ./full-test.sh
